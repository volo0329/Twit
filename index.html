<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jakae Twitter Archive</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #e7e9ea; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex justify-center">

    <div class="w-full max-w-xl border-x border-neutral-800 min-h-screen flex flex-col">
        <!-- 헤더 -->
        <header class="sticky top-0 bg-black/80 backdrop-blur-md border-b border-neutral-800 p-4 flex justify-between items-center z-10">
            <h1 class="text-xl font-bold">역극 아카이브</h1>
            <div class="flex gap-2">
                <button onclick="exportData()" class="bg-neutral-800 hover:bg-neutral-700 text-xs px-3 py-1.5 rounded-full font-bold transition">백업(JSON)</button>
                <label class="bg-neutral-800 hover:bg-neutral-700 text-xs px-3 py-1.5 rounded-full font-bold cursor-pointer transition">
                    불러오기 <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
                </label>
            </div>
        </header>

        <!-- 트윗 작성 박스 -->
        <div class="border-b border-neutral-800 p-4">
            <div class="flex gap-3">
                <div class="w-10 h-10 rounded-full bg-neutral-700 flex items-center justify-center font-bold text-lg flex-shrink-0" id="previewAvatar">💬</div>
                <div class="flex-1 flex flex-col gap-2">
                    <div class="flex gap-2">
                        <input type="text" id="inputName" placeholder="이름 (닉네임)" class="bg-black border border-neutral-800 rounded px-2 py-1 text-sm w-1/2 focus:outline-none focus:border-sky-500">
                        <input type="text" id="inputId" placeholder="@handle" class="bg-black border border-neutral-800 rounded px-2 py-1 text-sm w-1/2 focus:outline-none focus:border-sky-500">
                    </div>
                    <textarea id="inputContent" rows="3" placeholder="무슨 일이 일어나고 있나요?" class="bg-black border border-neutral-800 rounded p-2 text-sm focus:outline-none focus:border-sky-500 resize-none"></textarea>
                    <div class="flex justify-between items-center mt-1">
                        <input type="text" id="inputAvatarUrl" placeholder="프프로필 이미지 URL (선택)" class="bg-black border border-neutral-800 rounded px-2 py-1 text-xs w-1/2 focus:outline-none focus:border-sky-500">
                        <button onclick="addTweet()" class="bg-sky-500 hover:bg-sky-400 text-white font-bold px-4 py-1.5 rounded-full text-sm transition">게시하기</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 타임라인 피드 -->
        <div id="timeline" class="flex-1 divide-y divide-neutral-800">
            <!-- 트윗들이 여기에 렌더링됨 -->
        </div>
    </div>

    <script>
        let tweets = JSON.parse(localStorage.getItem('jakae_tweets')) || [];

        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            if (tweets.length === 0) {
                timeline.innerHTML = '<div class="p-8 text-center text-neutral-500 text-sm">아직 작성된 로그가 없어... 첫 트윗을 남겨봐!</div>';
                return;
            }

            tweets.forEach((tweet, index) => {
                const div = document.createElement('div');
                div.className = 'p-4 hover:bg-neutral-950/50 transition flex gap-3 relative group';
                
                let avatarHtml = `<div class="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center font-bold flex-shrink-0 text-sm overflow-hidden">👤</div>`;
                if (tweet.avatar) {
                    avatarHtml = `<div class="w-10 h-10 rounded-full bg-neutral-800 flex-shrink-0 overflow-hidden"><img src="${tweet.avatar}" class="w-full h-full object-cover"></div>`;
                }

                div.innerHTML = `
                    ${avatarHtml}
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5">
                            <span class="font-bold text-sm truncate">${escapeHtml(tweet.name)}</span>
                            <span class="text-neutral-500 text-xs truncate">${escapeHtml(tweet.handle)}</span>
                            <span class="text-neutral-600 text-xs">·</span>
                            <span class="text-neutral-500 text-xs">${tweet.date}</span>
                        </div>
                        <div class="mt-1 text-sm whitespace-pre-wrap break-words leading-relaxed">${escapeHtml(tweet.content)}</div>
                    </div>
                    <button onclick="deleteTweet(${index})" class="absolute top-3 right-3 text-neutral-600 hover:text-red-500 opacity-0 group-hover:opacity-100 transition text-xs">삭제</button>
                `;
                timeline.appendChild(div);
            });
        }

        function addTweet() {
            const name = document.getElementById('inputName').value.trim();
            const handle = document.getElementById('inputId').value.trim();
            const content = document.getElementById('inputContent').value.trim();
            const avatar = document.getElementById('inputAvatarUrl').value.trim();

            if (!name || !content) {
                alert('이름이랑 내용은 적어줘야지...!');
                return;
            }

            const now = new Date();
            const dateStr = `${now.getMonth() + 1}월 ${now.getDate()}일`;

            const newTweet = {
                name,
                handle: handle ? (handle.startsWith('@') ? handle : '@' + handle) : '@unknown',
                content,
                avatar,
                date: dateStr,
                timestamp: now.getTime()
            };

            tweets.unshift(newTweet); // 최신글이 위로
            saveAndRender();

            // 입력창 초기화 (내용만)
            document.getElementById('inputContent').value = '';
        }

        function deleteTweet(index) {
            if (confirm('이 로그를 지울 거야...?')) {
                tweets.splice(index, 1);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('jakae_tweets', JSON.stringify(tweets));
            renderTimeline();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tweets, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `jakae_archive_${Date.now()}.json`);
            dlAnchorElem.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        tweets = imported;
                        saveAndRender();
                        alert('백업 파일 불러오기 성공!');
                    } else {
                        alert('파일 형식이 잘못된 것 같은데... 확인해봐.');
                    }
                } catch (err) {
                    alert('JSON 파일을 읽는 중에 에러가 났어.');
                }
            };
            reader.readAsText(file);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 초기 렌더링
        renderInnerHTML = renderTimeline();
        renderTimeline();
    </script>
</body>
</html>
